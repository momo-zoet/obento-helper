<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>當季美味便當備餐小幫手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf6f0; --card:#ffffff; --ink:#3d2c29; --sub:#7a625a;
  --line:#ebdcd5; --acc:#e05a47; --acc-light:#fdebe8; --honey:#f2994a;
  --fh:"Huninn","jf-openhuninn","Noto Sans TC",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",sans-serif;line-height:1.6}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 60px;position:relative}

/* 右上角無框三條槓選單 */
.top-actions{position:absolute;top:20px;right:16px;z-index:10}
.menu-btn{background:none;border:none;color:var(--ink);font-size:26px;cursor:pointer;padding:4px 8px;line-height:1;transition:opacity .12s}
.menu-btn:hover{opacity:0.7}
.menu-dropdown{display:none;position:absolute;top:44px;right:0;width:210px;background:var(--card);border:2px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,0.08);padding:8px 0;z-index:20}
.menu-dropdown.show{display:block}
.menu-item{display:block;width:100%;padding:10px 16px;background:none;border:none;text-align:left;font:inherit;font-size:15px;color:var(--ink);cursor:pointer;text-decoration:none}
.menu-item:hover{background:#fdebe8;color:var(--acc)}
.menu-divider{height:1px;background:var(--line);margin:6px 0}

header{margin-bottom:20px;padding-right:45px}
h1{font-family:var(--fh);font-size:26px;margin:0;color:var(--acc)}

.categories{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:20px}
.cat-chip{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:20px;padding:6px 14px;font-size:13.5px;white-space:nowrap}
.cat-chip.active{background:var(--honey);color:#fff;border-color:var(--honey)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;position:relative;display:flex;flex-direction:column;cursor:pointer;transition:transform .1s}
.card:hover{border-color:var(--acc);transform:translateY(-2px)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start}
.card-title{font-family:var(--fh);font-size:18px;margin:0 0 6px}
.emoji-icon{font-family:"Noto Color Emoji",sans-serif;font-size:30px;margin-right:8px}
.fav-btn{background:none;border:none;font-size:22px;cursor:pointer;padding:0;color:#ccc;z-index:2}
.fav-btn.active{color:var(--acc)}

.badges{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.badge{font-size:11.5px;padding:2px 8px;border-radius:10px;background:var(--bg);color:var(--sub)}
.badge.season{background:#e2f5ea;color:#27ae60;font-weight:bold}

.plan-section{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px;margin-bottom:20px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.form-group label{display:block;font-size:13.5px;color:var(--sub);margin-bottom:6px}
.form-group select, .form-group input{width:100%;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:var(--bg)}
.checkbox-group{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;font-size:14px}
.checkbox-group label{display:flex;align-items:center;gap:4px;cursor:pointer}

.market-list{background:#fff9f2;border:1.5px solid var(--honey);border-radius:14px;padding:16px;margin-top:14px}
.market-item{display:flex;justify-content:space-between;border-bottom:1px solid #fae8d2;padding:6px 0;font-size:14px}
.gen-btn{background:var(--acc);color:#fff;border:none;padding:10px 20px;border-radius:10px;font-family:var(--fh);font-size:15px;cursor:pointer;width:100%;margin-top:10px}

.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:10;justify-content:center;align-items:center;padding:16px}
.modal-content{background:var(--card);border-radius:20px;max-width:500px;width:100%;padding:24px;position:relative;max-height:90vh;overflow-y:auto}
.close-modal{position:absolute;top:16px;right:16px;background:none;border:none;font-size:20px;cursor:pointer}
.day-plan-card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top-actions">
    <button class="menu-btn" id="menuBtn">☰</button>
    <div class="menu-dropdown" id="menuDropdown">
      <button class="menu-item" onclick="switchTab('recipes')">📖 食譜庫</button>
      <button class="menu-item" onclick="switchTab('plan')">🛒 備餐與採買</button>
      <button class="menu-item" id="menu-fav-label" onclick="switchTab('favs')">❤️ 我的食譜庫 (0)</button>
      <div class="menu-divider"></div>
      <a href="https://momo-zoet.github.io/Sous-vide/" class="menu-item">🥩 舒肥計算機</a>
    </div>
  </div>

  <header>
    <h1 id="page-main-title">🍱 智慧便當備餐小幫手</h1>
  </header>

  <!-- 食譜瀏覽頁 -->
  <div id="page-recipes">
    <div class="categories" id="cat-list"></div>
    <div class="grid" id="recipe-grid"></div>
  </div>

  <!-- 我的食譜庫（收藏）頁 -->
  <div id="page-favs" style="display:none;">
    <h2 style="font-family:var(--fh);margin-top:0;">❤️ 我的收藏食譜庫</h2>
    <div class="grid" id="fav-grid"></div>
  </div>

  <!-- 智慧備餐與採買頁 -->
  <div id="page-plan" style="display:none;">
    <div class="plan-section">
      <h2 style="font-family:var(--fh);margin-top:0;">⚙️ 備餐天數與偏好設定</h2>
      <div class="form-grid">
        <div class="form-group">
          <label>備餐天數 (天)</label>
          <input type="number" id="days" value="5" min="1" max="7">
        </div>
        <div class="form-group">
          <label>每餐類型</label>
          <select id="meal-type">
            <option value="lunch">僅準備「午餐」</option>
            <option value="both" selected>準備「午餐與晚餐」</option>
          </select>
        </div>
        <div class="form-group">
          <label>健身目標</label>
          <select id="goal">
            <option value="cut">🔥 減脂期（熱量赤字）</option>
            <option value="bulk">💪 增肌期（熱量盈餘）</option>
          </select>
        </div>
        <div class="form-group">
          <label>生理性別 / 體重</label>
          <div style="display:flex;gap:6px;">
            <select id="gender" style="width:40%;">
              <option value="male">男</option>
              <option value="female">女</option>
            </select>
            <input type="number" id="weight" value="65" placeholder="體重kg" style="width:60%;">
          </div>
        </div>
      </div>

      <div class="form-group" style="margin-bottom:16px;">
        <label>蛋白質與主食偏好（可複選）</label>
        <div class="checkbox-group">
          <label><input type="checkbox" name="pref" value="雞肉" checked> 雞肉</label>
          <label><input type="checkbox" name="pref" value="牛肉" checked> 牛肉</label>
          <label><input type="checkbox" name="pref" value="豬肉" checked> 豬肉</label>
          <label><input type="checkbox" name="pref" value="海鮮" checked> 蝦子/海鮮</label>
          <label><input type="checkbox" name="pref" value="素食"> 純素 (豆腐/豆製品)</label>
          <label><input type="checkbox" name="pref" value="蛋奶素"> 蛋奶素 (含蛋/乳製品)</label>
        </div>
      </div>

      <button class="gen-btn" onclick="generatePlan()">✨ 生成天數菜單與採買清單 (天天不重樣)</button>
    </div>

    <div class="plan-section" id="plan-result-box" style="display:none;">
      <h3 style="font-family:var(--fh);margin-top:0;" id="result-title">🗓️ 本週豐富便當菜單</h3>
      <div id="selected-recipes-list"></div>
      
      <div class="market-list">
        <h3 style="font-family:var(--fh);margin:0 0 10px;color:var(--honey);">🛒 菜市場合併總採買清單</h3>
        <div id="shopping-ingredients"></div>
      </div>
    </div>
  </div>
</div>

<!-- 食譜詳細彈跳視窗 -->
<div class="modal" id="recipe-modal">
  <div class="modal-content">
    <button class="close-modal" onclick="closeModal()">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
var menuBtn = document.getElementById("menuBtn");
var menuDropdown = document.getElementById("menuDropdown");
menuBtn.onclick = function(e){
  e.stopPropagation();
  menuDropdown.classList.toggle("show");
};
window.onclick = function(){
  if(menuDropdown.classList.contains("show")){
    menuDropdown.classList.remove("show");
  }
};

var CATEGORIES = ["全部", "全穀雜糧類", "豆魚蛋肉類", "蔬菜類", "水果類", "乳製品類", "油脂與堅果"];

var RECIPES = [
  { id: 1, name: "日式烤地瓜與南瓜雙拼", cat: "全穀雜糧類", emoji: "🍠", isSeason: true, type: "carb", 
    ingredients: [{n:"地瓜", q:150, u:"g"}, {n:"南瓜", q:100, u:"g"}],
    steps: "1. 地瓜與南瓜洗淨切塊。<br>2. 放入電鍋外鍋 1.5 杯水蒸熟，或用烤箱 200°C 烘烤 30 分鐘。" },
  { id: 2, name: "清香紫米糙飯糰", cat: "全穀雜糧類", emoji: "🍙", isSeason: false, type: "carb",
    ingredients: [{n:"紫米", q:80, u:"g"}, {n:"糙米", q:80, u:"g"}],
    steps: "1. 紫米與糙米洗淨浸泡 2 小時。<br>2. 以正常水量放入電鍋煮熟後捏成飯糰。" },
  { id: 3, name: "香草黑胡椒舒肥雞胸", cat: "豆魚蛋肉類", emoji: "🍗", isSeason: false, type: "雞肉",
    ingredients: [{n:"雞胸肉", q:200, u:"g"}, {n:"黑胡椒", q:2, u:"g"}, {n:"橄欖油", q:5, u:"ml"}],
    steps: "1. 雞胸肉擦乾抹上黑胡椒與橄欖油真空密封。<br>2. 舒肥 65°C / 60 分鐘。起鍋後表面大火乾煎 30 秒。" },
  { id: 4, name: "蒜香清蒸鱸魚片", cat: "豆魚蛋肉類", emoji: "🐟", isSeason: true, type: "海鮮",
    ingredients: [{n:"鱸魚片", q:180, u:"g"}, {n:"青蔥", q:15, u:"g"}, {n:"薑絲", q:10, u:"g"}],
    steps: "1. 鱸魚片鋪上薑絲與蔥段。<br>2. 水滾後大火蒸 8 分鐘即可。" },
  { id: 5, name: "醬燒牛里肌洋蔥片", cat: "豆魚蛋肉類", emoji: "🥩", isSeason: false, type: "牛肉",
    ingredients: [{n:"牛里肌肉", q:180, u:"g"}, {n:"洋蔥", q:50, u:"g"}, {n:"醬油", q:15, u:"ml"}],
    steps: "1. 洋蔥切絲炒軟，加入牛里肌肉片拌炒。<br>2. 淋上少許醬油炒熟即可起鍋。" },
  { id: 6, name: "嫩煎梅花豬排", cat: "豆魚蛋肉類", emoji: "🥓", isSeason: false, type: "豬肉",
    ingredients: [{n:"豬梅花肉", q:180, u:"g"}],
    steps: "1. 熱鍋不加油，直接下梅花豬排逼出油脂。<br>2. 兩面煎至金黃熟透即可切片。" },
  { id: 7, name: "鮮蝦炒櫛瓜", cat: "豆魚蛋肉類", emoji: "🦐", isSeason: true, type: "海鮮",
    ingredients: [{n:"蝦仁", q:120, u:"g"}, {n:"櫛瓜", q:150, u:"g"}, {n:"蒜頭", q:10, u:"g"}],
    steps: "1. 櫛瓜切片與蒜頭先炒半熟。<br>2. 加入蝦仁拌炒至蝦子變紅熟透。" },
  { id: 8, name: "日式醬油煎豆腐", cat: "豆魚蛋肉類", emoji: "🧊", isSeason: false, type: "素食",
    ingredients: [{n:"板豆腐", q:1, u:"塊"}, {n:"醬油", q:10, u:"ml"}],
    steps: "1. 板豆腐切厚片，入鍋煎至兩面金黃。<br>2. 淋上薄醬油燒入味即可。" },
  { id: 9, name: "黃金厚蛋燒", cat: "豆魚蛋肉類", emoji: "🍳", isSeason: false, type: "蛋奶素",
    ingredients: [{n:"雞蛋", q:2, u:"顆"}],
    steps: "1. 雞蛋打散加少許鹽。<br>2. 分次倒入平底鍋捲起煎熟。" },
  { id: 10, name: "蒜炒翠綠綠花椰菜", cat: "蔬菜類", emoji: "🥦", isSeason: true, type: "veg",
    ingredients: [{n:"綠花椰菜", q:150, u:"g"}, {n:"大蒜", q:5, u:"g"}],
    steps: "1. 花椰菜切小朵川燙 1 分鐘撈起。<br>2. 熱油下蒜碎與花椰菜快速拌炒。" },
  { id: 11, name: "清炒高麗菜", cat: "蔬菜類", emoji: "🥬", isSeason: true, type: "veg",
    ingredients: [{n:"高麗菜", q:150, u:"g"}],
    steps: "1. 高麗菜洗淨切片。<br>2. 大火快炒 2 分鐘加鹽調味。" },
  { id: 12, name: "鮮香菇炒四季豆", cat: "蔬菜類", emoji: "🫛", isSeason: true, type: "veg",
    ingredients: [{n:"四季豆", q:100, u:"g"}, {n:"鮮香菇", q:50, u:"g"}],
    steps: "1. 四季豆去絲切段，香菇切片。<br>2. 拌炒至四季豆熟軟。" },
  { id: 13, name: "鮮切哈密瓜盒", cat: "水果類", emoji: "🍈", isSeason: true, type: "fruit",
    ingredients: [{n:"哈密瓜", q:150, u:"g"}],
    steps: "1. 哈密瓜去籽切塊裝盒。" },
  { id: 14, name: "黃金木瓜切片", cat: "水果類", emoji: "🧡", isSeason: true, type: "fruit",
    ingredients: [{n:"木瓜", q:150, u:"g"}],
    steps: "1. 木瓜去皮去籽切塊。" },
  { id: 15, name: "希臘優格搭堅果", cat: "乳製品類", emoji: "🥛", isSeason: false, type: "蛋奶素",
    ingredients: [{n:"無糖希臘優格", q:150, u:"g"}, {n:"綜合堅果", q:10, u:"g"}],
    steps: "1. 優格裝碗撒上堅果即可食用。" }
];

var currentCat = "全部";
var favorites = JSON.parse(localStorage.getItem("bento_favs") || "[]");

function saveFavs(){ 
  localStorage.setItem("bento_favs", JSON.stringify(favorites)); 
  updateFavCount();
}

function updateFavCount(){
  document.getElementById("menu-fav-label").textContent = "❤️ 我的食譜庫 (" + favorites.length + ")";
}

function toggleFav(id, event){
  event.stopPropagation();
  var idx = favorites.indexOf(id);
  if(idx > -1) favorites.splice(idx, 1);
  else favorites.push(id);
  saveFavs();
  renderRecipes();
  renderFavs();
}

function switchTab(tab){
  document.getElementById("page-recipes").style.display = tab==='recipes'?'block':'none';
  document.getElementById("page-plan").style.display = tab==='plan'?'block':'none';
  document.getElementById("page-favs").style.display = tab==='favs'?'block':'none';
  
  if(tab === 'favs') renderFavs();
  menuDropdown.classList.remove("show");
  window.scrollTo(0,0);
}

function renderCategories(){
  var html = CATEGORIES.map(function(c){
    return '<button class="cat-chip '+(c===currentCat?'active':'')+'" onclick="filterCat(\''+c+'\')">'+c+'</button>';
  }).join("");
  document.getElementById("cat-list").innerHTML = html;
}

function filterCat(c){
  currentCat = c;
  renderCategories();
  renderRecipes();
}

function renderRecipes(){
  var list = RECIPES.filter(function(r){ return currentCat === "全部" || r.cat === currentCat; });
  var html = list.map(function(r){
    var isFav = favorites.includes(r.id);
    return '<div class="card" onclick="openRecipeModal('+r.id+')">' +
      '<div class="card-header">' +
        '<div><span class="emoji-icon">'+r.emoji+'</span><h3 class="card-title" style="display:inline-block;">'+r.name+'</h3></div>' +
        '<button class="fav-btn '+(isFav?'active':'')+'" onclick="toggleFav('+r.id+', event)">'+(isFav?'❤️':'🤍')+'</button>' +
      '</div>' +
      '<div class="badges">' +
        '<span class="badge">'+r.cat+'</span>' +
        (r.isSeason ? '<span class="badge season">🌱 當季盛產 (農業部)</span>' : '') +
      '</div>' +
      '<div style="font-size:13px;color:var(--sub);">點擊查看完整食譜與作法 ➔</div>' +
    '</div>';
  }).join("");
  document.getElementById("recipe-grid").innerHTML = html;
}

function renderFavs(){
  var list = RECIPES.filter(function(r){ return favorites.includes(r.id); });
  if(list.length === 0){
    document.getElementById("fav-grid").innerHTML = '<p style="color:var(--sub);">目前還沒有收藏任何食譜喔！快去食譜庫點擊愛心吧 ❤️</p>';
    return;
  }
  var html = list.map(function(r){
    return '<div class="card" onclick="openRecipeModal('+r.id+')">' +
      '<div class="card-header">' +
        '<div><span class="emoji-icon">'+r.emoji+'</span><h3 class="card-title" style="display:inline-block;">'+r.name+'</h3></div>' +
        '<button class="fav-btn active" onclick="toggleFav('+r.id+', event)">❤️</button>' +
      '</div>' +
      '<div class="badges">' +
        '<span class="badge">'+r.cat+'</span>' +
        (r.isSeason ? '<span class="badge season">🌱 當季盛產 (農業部)</span>' : '') +
      '</div>' +
      '<div style="font-size:13px;color:var(--sub);">點擊查看完整食譜與作法 ➔</div>' +
    '</div>';
  }).join("");
  document.getElementById("fav-grid").innerHTML = html;
}

function openRecipeModal(id){
  var r = RECIPES.filter(function(x){ return x.id === id; })[0];
  if(!r) return;
  var ingHtml = r.ingredients.map(function(i){ return '<li>'+i.n + '：' + i.q + i.u+'</li>'; }).join("");
  var html = '<h2 style="font-family:var(--fh);margin-top:0;">'+r.emoji+' '+r.name+'</h2>' +
    '<p><span class="badge">'+r.cat+'</span> '+(r.isSeason?'<span class="badge season">🌱 當季盛產</span>':'')+'</p>' +
    '<h4 style="font-family:var(--fh);margin:12px 0 4px;color:var(--acc);">📦 食材清單</h4>' +
    '<ul style="margin:0;padding-left:20px;font-size:14px;">'+ingHtml+'</ul>' +
    '<h4 style="font-family:var(--fh);margin:12px 0 4px;color:var(--acc);">🍳 烹調與作法步驟</h4>' +
    '<p style="font-size:14px;background:var(--bg);padding:10px;border-radius:10px;line-height:1.5;">'+r.steps+'</p>';
  document.getElementById("modal-body").innerHTML = html;
  document.getElementById("recipe-modal").style.display = "flex";
}

function closeModal(){
  document.getElementById("recipe-modal").style.display = "none";
}

function generatePlan(){
  var days = parseInt(document.getElementById("days").value) || 5;
  var mealType = document.getElementById("meal-type").value;
  var totalMeals = mealType === 'lunch' ? days : days * 2;

  var prefs = [];
  document.querySelectorAll('input[name="pref"]:checked').forEach(function(el){ prefs.push(el.value); });

  var filtered = RECIPES.filter(function(r){
    if(r.cat === "全穀雜糧類" || r.cat === "蔬菜類" || r.cat === "水果類" || r.cat === "乳製品類") return true;
    if(prefs.includes("素食") && (r.type === "素食" || r.type === "carb")) return true;
    if(prefs.includes("蛋奶素") && (r.type === "素食" || r.type === "蛋奶素" || r.type === "乳製品")) return true;
    return prefs.includes(r.type);
  });

  if(filtered.length === 0) filtered = RECIPES;

  var shuffled = filtered.slice().sort(function(){ return 0.5 - Math.random(); });
  var dayPlansHtml = "";
  var marketMap = {};

  for(var d = 1; d <= days; d++){
    var lunchRecipe = shuffled[(d * 2 - 2) % shuffled.length];
    var dinnerRecipe = mealType === 'both' ? shuffled[(d * 2 - 1) % shuffled.length] : null;

    [lunchRecipe, dinnerRecipe].forEach(function(rec){
      if(rec){
        rec.ingredients.forEach(function(ing){
          if(!marketMap[ing.n]) marketMap[ing.n] = { q: 0, u: ing.u };
          marketMap[ing.n].q += ing.q;
        });
      }
    });

    dayPlansHtml += '<div class="day-plan-card">' +
      '<b style="color:var(--acc);">📅 第 '+d+' 天</b><br>' +
      '☀️ 午餐：'+lunchRecipe.emoji+' '+lunchRecipe.name+'<br>' +
      (dinnerRecipe ? '🌙 晚餐：'+dinnerRecipe.emoji+' '+dinnerRecipe.name : '') +
    '</div>';
  }

  document.getElementById("plan-result-box").style.display = "block";
  document.getElementById("result-title").innerHTML = "🗓️ 本週 "+days+" 天份專屬便當菜單 (總計 "+totalMeals+" 餐，保證不重複)";
  document.getElementById("selected-recipes-list").innerHTML = dayPlansHtml;

  var marketHtml = "";
  for(var key in marketMap){
    marketHtml += '<div class="market-item"><span>🥦 '+key+'</span><b>'+marketMap[key].q + ' ' + marketMap[key].u+'</b></div>';
  }
  document.getElementById("shopping-ingredients").innerHTML = marketHtml;
}

renderCategories();
renderRecipes();
updateFavCount();
</script>
</body>
</html>
